name: tech_interview
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Black.otf
        - asset: fonts/Inter-SemiBold.otf
        - asset: fonts/Inter-Medium.otf
          weight: 500
        - asset: fonts/Inter-Bold.otf
          weight: 600
        - asset: fonts/Inter-Regular.otf
        - asset: fonts/Inter-Thin.otf
  assets:
    - assets/svgs
    - assets/imgs
